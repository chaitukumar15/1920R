<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       form {
  background-color: #fff;
  display: block;
  padding: 1rem;
  max-width: 350px;
  border-radius: 0.5rem;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}
label{
  font-size: 1.25rem;
  line-height: 1.75rem;
  font-weight: 600;
  text-align: center;
  color: #000;
 
}
input {
  position: relative;
}
 input, .form input[type='submit'] {
  outline: none;
  border: 1px solid #e5e7eb;
  margin: 8px 0;
}
input[type='submit']{
    
  display: block;
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
  padding-left: 1.25rem;
  padding-right: 1.25rem;
  background-color: #4F46E5;
  color: #ffffff;
  font-size: 0.875rem;
  line-height: 1.25rem;
  font-weight: 500;
  width: 100%;
  border-radius: 0.5rem;
  text-transform: uppercase;

}
input{
    width: 80%;
    height: 5vh;
    border-radius: 10px ;
}

body{
    display: flex;
    justify-content: center;
    height: 100vh;
    align-items: center;
}

    </style>
</head>
<body>
    <form action="http://localhost:3003/register" method='post' enctype="application/x-www-form-urlencoded">
        <label for="name">Full Name:</label>
        <input type="text" name="name" placeholder="Enter Name" id="name"  required>
        <label for="password">Password:</label>
        <input type="text" name="password" placeholder="enter password"  title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
       <br> <label for="email">Email:</label> <br>
        <input type="text" name="email" placeholder="enter email id" pattern="/^[a-zA-Z0-9.!#$%&’+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)$/"
        required>
        <label for="gender">Gender:</label>
        <select name="gender" id="">
            <option value="select">select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <input type="submit" value="Register">
    </form>
</body>
</html>
